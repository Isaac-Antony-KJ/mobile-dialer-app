<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamline Dialer</title>
    <!-- SheetJS Library for reading Excel/CSV files -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --card-border: #d2d2d7;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --input-bg: #fbfbfd;
            --success-color: #34c759;
            --warning-color: #ff9500;
            --danger-color: #ff3b30;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --card-bg: #161617;
            --card-border: #38383a;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --apple-blue: #2997ff;
            --apple-blue-hover: #0077ed;
            --input-bg: #1d1d1f;
            --success-color: #30d158;
            --warning-color: #ff9f0a;
            --danger-color: #ff453a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; 
            padding: 24px 16px; 
            background: var(--bg-color); 
            color: var(--text-main); 
            max-width: 480px; 
            margin: auto; 
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
        }

        h2 {
            margin: 0;
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: -0.01em;
            font-size: 1.4rem;
        }

        .theme-toggle-btn {
            background: var(--card-border);
            border: none;
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 980px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .theme-toggle-btn:hover {
            opacity: 0.8;
        }

        h3 {
            font-size: 0.95rem;
            margin-top: 0;
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 12px;
        }

        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 18px; 
            border: 1px solid var(--card-border);
            margin-bottom: 16px; 
            box-shadow: var(--shadow);
            transition: background 0.3s ease, border 0.3s ease;
        }

        .contact-row, .queue-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 8px; 
            border-bottom: 1px solid var(--card-border); 
            font-size: 13.5px; 
            color: var(--text-main);
        }

        .contact-row:last-child, .queue-item:last-child {
            border-bottom: none;
        }

        .completed { 
            color: var(--success-color); 
            text-decoration: line-through; 
            opacity: 0.8;
        }

        .btn { 
            display: block; 
            background: var(--apple-blue); 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 980px; 
            font-size: 14px; 
            font-weight: 400;
            cursor: pointer; 
            text-decoration: none; 
            text-align: center; 
            margin: 10px 0; 
            width: 100%; 
            box-sizing: border-box;
            letter-spacing: -0.01em;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background: var(--apple-blue-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-success { 
            background: var(--success-color); 
            color: #ffffff;
        }

        .btn-warning { 
            background: var(--warning-color); 
            color: #ffffff; 
        }

        .btn-danger { 
            background: var(--danger-color); 
            color: #ffffff; 
        }
        .btn-danger:hover { opacity: 0.9; }

        .btn-secondary { 
            background: transparent; 
            color: var(--apple-blue); 
            border: 1px solid var(--card-border);
        }
        .btn-secondary:hover { 
            background: var(--card-border);
        }

        .button-group { 
            display: flex; 
            gap: 10px; 
        }

        input[type="file"] { display: none; }

        .file-upload-label { 
            background: transparent; 
            color: var(--apple-blue); 
            border: 1px solid var(--card-border);
            padding: 12px 20px; 
            border-radius: 980px; 
            display: block; 
            text-align: center; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 400;
            margin-top: 10px; 
            transition: background 0.2s;
        }
        .file-upload-label:hover {
            background: var(--card-border);
        }

        input[type="text"], input[type="tel"] { 
            width: 100%; 
            padding: 10px 14px; 
            box-sizing: border-box; 
            border: 1px solid var(--card-border); 
            border-radius: 10px; 
            font-size: 14px; 
            margin-bottom: 10px; 
            background: var(--input-bg);
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="tel"]:focus {
            outline: none;
            border-color: var(--apple-blue);
        }

        .scroll-box { 
            max-height: 180px; 
            overflow-y: auto; 
            border: 1px solid var(--card-border); 
            border-radius: 10px; 
            margin-top: 10px; 
            background: var(--input-bg);
        }

        .manual-section { 
            border-top: 1px solid var(--card-border); 
            padding-top: 16px; 
            margin-top: 16px; 
        }

        .target-box {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>Queue Dialer</h2>
        <button class="theme-toggle-btn" onclick="toggleTheme()">Appearance</button>
    </div>

    <!-- Step 1: Load Contacts via File Upload -->
    <div class="card" id="upload-card">
        <h3>Source Data</h3>
        <p style="font-size: 13px; color: var(--text-muted); line-height: 1.4; margin-bottom: 12px;">Upload an Excel or CSV spreadsheet (Column A: Name, Column B: Phone).</p>
        <label class="file-upload-label">
            Choose File
            <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event)">
        </label>
        
        <button class="btn btn-secondary" style="margin-top: 10px;" onclick="skipToQueue()">Manual Mode</button>
    </div>

    <!-- Step 2: Custom Search & Selection Box -->
    <div class="card" id="search-card" style="display:none;">
        <h3>Select Recipients</h3>
        <input type="text" id="search-box" placeholder="Search records..." oninput="filterMasterList()">
        
        <div class="scroll-box" id="master-contact-list">
            <!-- Dynamically populated searchable list -->
        </div>

        <button class="btn" style="margin-top: 14px;" onclick="generateQueue()">Create Queue</button>
    </div>

    <!-- Step 3: Active Calling Control Panel -->
    <div class="card" id="active-panel" style="display:none;">
        <h3>Current Call</h3>
        <div class="target-box">
            <p id="target-info" style="font-size: 15px; font-weight: 500; color: var(--text-main); margin: 0;"></p>
        </div>
        
        <a id="dial-link" href="#" class="btn">Dial Number</a>

        <p style="font-size: 12px; color: var(--text-muted); margin-top: 12px; text-align: center;">Actions:</p>
        <div class="button-group">
            <button class="btn btn-warning" onclick="redialCurrent()">Redial</button>
            <button class="btn btn-success" onclick="nextContact()">Next</button>
        </div>
        
        <button class="btn btn-danger" style="margin-top: 12px;" onclick="promptBreakOrEnd()">⏹️ Stop & Session Report</button>
    </div>

    <!-- Step 4: Active Queue View & Manual Add -->
    <div class="card" id="queue-card" style="display:none;">
        <h3>Queue Status (<span id="queue-count">0</span>)</h3>
        <div id="queue-list" class="scroll-box" style="max-height: 150px; border: none; background: transparent;"></div>

        <!-- Manual Add on the Fly -->
        <div class="manual-section">
            <h4 style="margin-top:0; font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Add Number</h4>
            <input type="text" id="manual-name" placeholder="Name">
            <input type="tel" id="manual-phone" placeholder="Phone Number" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)">
            <button class="btn btn-secondary" onclick="addManualNumber()">Add to Queue</button>
        </div>
    </div>

    <!-- Step 5: Report Card (Hidden until generated) -->
    <div class="card" id="report-card" style="display:none;">
        <h3>📊 Session Report</h3>
        <div id="report-content" style="font-size: 13.5px; line-height: 1.5; margin-bottom: 15px;"></div>
        
        <div class="button-group">
            <button class="btn btn-secondary" onclick="copyReport()">📋 Copy</button>
            <button class="btn btn-success" onclick="sendWhatsApp()">💬 WhatsApp</button>
        </div>
        <button class="btn btn-secondary" style="margin-top: 8px;" onclick="resetApp()">Start New Session</button>
    </div>

    <script>
        let masterContacts = []; 
        let callQueue = [];
        let currentIndex = 0;

        function initTheme() {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        }
        initTheme();

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        });

        function toggleTheme() {
            const html = document.documentElement;
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
            } else {
                html.setAttribute('data-theme', 'dark');
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    masterContacts = [];
                    jsonRows.forEach((row, idx) => {
                        if (row && row.length >= 2) {
                            let nameVal = String(row[0] || "").trim();
                            let phoneVal = String(row[1] || "").trim();
                            if (phoneVal) {
                                masterContacts.push({
                                    id: idx,
                                    name: nameVal || "Unknown",
                                    phone: phoneVal
                                });
                            }
                        }
                    });

                    if (masterContacts.length > 0) {
                        document.getElementById('upload-card').style.display = 'none';
                        document.getElementById('search-card').style.display = 'block';
                        renderMasterList(masterContacts);
                    } else {
                        alert("No valid phone numbers found. Ensure Column A is Name and Column B is Phone.");
                    }
                } catch (err) {
                    alert("Error reading file: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function skipToQueue() {
            document.getElementById('upload-card').style.display = 'none';
            document.getElementById('active-panel').style.display = 'block';
            document.getElementById('queue-card').style.display = 'block';
            updateUI();
        }

        function renderMasterList(contacts) {
            const container = document.getElementById('master-contact-list');
            container.innerHTML = '';
            
            contacts.forEach(c => {
                let div = document.createElement('div');
                div.className = 'contact-row';
                div.innerHTML = `
                    <label style="display:flex; align-items:center; gap: 10px; width: 100%; cursor: pointer;">
                        <input type="checkbox" value="${c.id}" class="contact-checkbox" style="width: 16px; height: 16px; accent-color: var(--apple-blue);">
                        <span><strong>${c.name}</strong> <span style="color: var(--text-muted); font-size: 12.5px;">(${c.phone})</span></span>
                    </label>
                `;
                container.appendChild(div);
            });
        }

        function filterMasterList() {
            let query = document.getElementById('search-box').value.toLowerCase();
            let filtered = masterContacts.filter(c => 
                c.name.toLowerCase().includes(query) || c.phone.includes(query)
            );
            renderMasterList(filtered);
        }

        function generateQueue() {
            const checkboxes = document.querySelectorAll('.contact-checkbox:checked');
            
            callQueue = [];
            checkboxes.forEach(cb => {
                let contactId = parseInt(cb.value);
                let originalContact = masterContacts.find(c => c.id === contactId);
                if (originalContact) {
                    callQueue.push({
                        name: originalContact.name,
                        phone: originalContact.phone,
                        status: "pending"
                    });
                }
            });

            document.getElementById('search-card').style.display = 'none';
            document.getElementById('active-panel').style.display = 'block';
            document.getElementById('queue-card').style.display = 'block';
            updateUI();
        }

        function addManualNumber() {
            let nameInput = document.getElementById('manual-name').value.trim();
            let phoneInput = document.getElementById('manual-phone').value.trim();

            if (phoneInput.length !== 10) {
                alert("Phone number must be exactly 10 digits.");
                return;
            }

            callQueue.push({
                name: nameInput || "Manual Entry",
                phone: phoneInput,
                status: "pending"
            });

            document.getElementById('manual-name').value = '';
            document.getElementById('manual-phone').value = '';

            updateUI();
        }

        function updateUI() {
            const listEl = document.getElementById('queue-list');
            listEl.innerHTML = '';
            
            let pendingCount = 0;
            let activeSet = false;

            callQueue.forEach((item, index) => {
                if (item.status === 'pending') pendingCount++;

                let div = document.createElement('div');
                div.className = `queue-item ${item.status === 'completed' ? 'completed' : ''}`;
                div.innerHTML = `<span>${index + 1}. <strong>${item.name}</strong></span> <span>${item.phone}</span>`;
                listEl.appendChild(div);

                if (item.status === 'pending' && !activeSet) {
                    currentIndex = index;
                    document.getElementById('target-info').innerText = `${item.name} — ${item.phone}`;
                    document.getElementById('dial-link').href = `tel:${item.phone}`;
                    activeSet = true;
                }
            });

            document.getElementById('queue-count').innerText = pendingCount;

            if (!activeSet && callQueue.length > 0) {
                document.getElementById('target-info').innerText = "All calls completed";
                document.getElementById('dial-link').style.display = 'none';
            } else if (callQueue.length === 0) {
                document.getElementById('target-info').innerText = "Queue is empty. Add targets below.";
                document.getElementById('dial-link').style.display = 'none';
            } else {
                document.getElementById('dial-link').style.display = 'block';
            }
        }

        function redialCurrent() {
            const currentItem = callQueue[currentIndex];
            if (currentItem) {
                window.location.href = `tel:${currentItem.phone}`;
            }
        }

        function nextContact() {
            if (callQueue[currentIndex]) {
                callQueue[currentIndex].status = 'completed';
                updateUI();
            }
        }

        function promptBreakOrEnd() {
            let choice = prompt("Choose an option:\n1 = Take a Break (Pause session)\n2 = End List & View Report", "1");
            
            if (choice === "1") {
                alert("Session paused. Resume whenever ready!");
            } else if (choice === "2") {
                showReport();
            }
        }

        function showReport() {
            document.getElementById('active-panel').style.display = 'none';
            document.getElementById('queue-card').style.display = 'none';
            
            let completedList = callQueue.filter(c => c.status === 'completed');
            let pendingList = callQueue.filter(c => c.status === 'pending');

            let reportHTML = `<strong>✅ Picked Up / Completed (${completedList.length}):</strong><br>`;
            if (completedList.length > 0) {
                completedList.forEach(c => { reportHTML += `- ${c.name} (${c.phone})<br>`; });
            } else {
                reportHTML += `None<br>`;
            }

            reportHTML += `<br><strong>⏳ Pending / Remaining (${pendingList.length}):</strong><br>`;
            if (pendingList.length > 0) {
                pendingList.forEach(c => { reportHTML += `- ${c.name} (${c.phone})<br>`; });
            } else {
                reportHTML += `None<br>`;
            }

            document.getElementById('report-content').innerHTML = reportHTML;
            document.getElementById('report-card').style.display = 'block';
        }

        function generateReportText() {
            let completedList = callQueue.filter(c => c.status === 'completed');
            let pendingList = callQueue.filter(c => c.status === 'pending');

            let text = `📊 *Call Session Report*\n\n`;
            text += `*Completed (${completedList.length}):*\n`;
            completedList.forEach(c => { text += `• ${c.name} (${c.phone})\n`; });

            text += `\n*Pending (${pendingList.length}):*\n`;
            pendingList.forEach(c => { text += `• ${c.name} (${c.phone})\n`; });

            return text;
        }

        function copyReport() {
            let reportText = generateReportText();
            navigator.clipboard.writeText(reportText).then(() => {
                alert("Report copied to clipboard!");
            });
        }

        function sendWhatsApp() {
            let reportText = encodeURIComponent(generateReportText());
            window.open(`https://wa.me/?text=${reportText}`, '_blank');
        }

        function resetApp() {
            location.reload();
        }
    </script>
</body>
</html>
